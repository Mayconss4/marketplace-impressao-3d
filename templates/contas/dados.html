{% extends "area_conta.html" %}
{% block titulo %}Dados da conta — Marketplace 3D{% endblock %}
{% block area %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h4 fw-bold mb-1">Dados da conta</h1>
        <p class="small text-body-secondary mb-0">Usuário: <strong>{{ user.username }}</strong> · desde {{ user.date_joined|date:"d/m/Y" }}</p>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'contas:senha' %}"><i class="bi bi-key"></i> Alterar senha</a>
    </div>
    <form method="post" novalidate class="col-lg-8 px-0">
      {% csrf_token %}
      {% include "includes/campos_form.html" %}
      <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Salvar</button>
    </form>
  </div>
</div>
{% endblock %}
