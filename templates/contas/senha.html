{% extends "area_conta.html" %}
{% block titulo %}Alterar senha — Marketplace 3D{% endblock %}
{% block area %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 fw-bold mb-3">Alterar senha</h1>
    <form method="post" novalidate class="col-lg-8 px-0">
      {% csrf_token %}
      {% include "includes/campos_form.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-key"></i> Alterar senha</button>
        <a class="btn btn-outline-secondary" href="{% url 'contas:dados' %}">Voltar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
